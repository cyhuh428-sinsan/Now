name: Windows installer QA

on:
  workflow_dispatch:
  push:
    branches: [codex/2.4.1]
    paths:
      - .github/workflows/windows-installer-qa.yml
      - desktop/scripts/check-installed-lifecycle.ps1
      - desktop/tests/installer-runner.test.mjs
      - desktop/tests/legacy-migration-approval.test.cjs

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check runner-only safety guard
        run: node --test desktop/tests/installer-runner.test.mjs desktop/tests/legacy-migration-approval.test.cjs desktop/tests/journal-current.test.cjs desktop/tests/history-select-session.test.cjs
      - name: Verify generated source
        run: node web/scripts/bundle_markdown.mjs --check
      - name: Install build dependencies
        working-directory: desktop
        run: npm ci
      - name: Build unpublished installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - name: Install, run both apps, restart and uninstall
        env:
          NOWNOTE_INSTALLER_QA: '1'
        run: ./desktop/scripts/check-installed-lifecycle.ps1
      - name: Preserve synthetic QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-qa-${{ github.sha }}
          path: |
            desktop/dist/installer-lifecycle.json
            desktop/dist/NowNote-Setup-2.4.1-x64.exe
            desktop/dist/NowNote-Setup-2.4.1-x64.exe.blockmap
          if-no-files-found: warn
          retention-days: 7
